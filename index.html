<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>جدول الحصص 🎀</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

  <div class="top-bar">
    <button class="ctrl-btn theme-btn" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span> <span id="theme-text">داكن</span>
    </button>
    <button class="ctrl-btn edit-btn" id="editBtn" onclick="toggleEditMode()">
      ✏️ <span id="edit-text">تعديل</span>
    </button>
  </div>

  <div class="kitty-container" style="margin-top: 45px;">

    <div class="kitty-head">
      <div class="bow">🎀</div>
      <span>جدول الدروس</span>
      <img class="hello-kitty-icon" src="https://img.icons8.com/?size=100&id=juRF5DiUGr4p&format=png&color=000000" alt="Hello Kitty">
    </div>

    <div class="inner-box">
      <h1>✨ مواعيد الدروس ✨</h1>

      <div class="edit-status" id="editStatus">✏️ جاري التعديل... اضغطي "حفظ" عند الانتهاء.</div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>اليوم</th>
              <th>المادة</th>
              <th>الوقت</th>
              <th>ملاحظات</th>
            </tr>
          </thead>
          <tbody id="schedule-body"></tbody>
        </table>
      </div>

      <!-- مؤشر بومودورو للمذاكرة -->
      <div class="pomodoro-card">
        <div class="pomodoro-title" id="pom-label">🍅 مؤشر بومودورو (وقت التركيز):</div>
        <div class="pomodoro-timer" id="pom-display">25:00</div>
        <div class="pomodoro-btns">
          <button class="pom-btn pom-start" onclick="startPomodoro()">ابدأ</button>
          <button class="pom-btn pom-pause" onclick="pausePomodoro()">إيقاف مؤقت</button>
          <button class="pom-btn pom-reset" onclick="resetPomodoro()">إعادة ضبط</button>
        </div>
      </div>

      <div class="goals-note">
        <h3>📌 أهداف الأسبوع / قائمة المهام:</h3>
        <textarea id="goals-input" rows="3" placeholder="اكتبي هنا الحاجات اللي عايزة تخلصيها الاسبوع ده..."></textarea>
      </div>

      <div class="footer-section">
        <button class="print-btn" onclick="window.print()">🖨️ طباعة / حفظ كـ PDF</button>
        <div class="footer-note">
          🌸 "النجاح يبدأ بخطوة صغيرة، بس حلوة! 💕"
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
